# Lints, tests, builds, and deploys the worker to Cloudflare Workers
# (httpbin.agrd.dev/*) on every push to master. Replicates the old Bamboo
# HTTPBIN plan. Pull requests are validated by ci.yml and never deploy.
name: Deploy

on:
  push:
    branches: [master]
  # Manual trigger to smoke-test the deploy pipeline without a master push
  # (everything deploy-side can otherwise only be exercised by a real deploy).
  workflow_dispatch:

# Serialize deploys: two master pushes must not race the wrangler deploy.
concurrency:
  group: deploy-ext-httpbin
  cancel-in-progress: false

jobs:
  build:
    name: Lint, test, build
    runs-on: team-extensions
    timeout-minutes: 30
    permissions:
      # contents: read — checkout only; this job never writes to the repo
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Keep in sync with the validation build in ci.yml (differs only in
      # --target/--output).
      - name: Lint, test, and build via Docker
        run: |
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --target build-output \
            --output ./dist \
            .

      - name: Upload worker artifact
        uses: actions/upload-artifact@v8
        with:
          name: worker
          path: dist
          # Only consumed by the deploy job seconds later.
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Workers
    needs: [build]
    # Production deploy environment: requires an approved review from the
    # extensions team before publishing (defined in terraform-github). Prevents
    # a merge from releasing to httpbin.agrd.dev without approval. The env is
    # also branch-restricted to master, matching the guard below.
    if: github.ref == 'refs/heads/master'
    environment: production
    runs-on: team-extensions
    timeout-minutes: 10
    permissions:
      # contents: read — checkout (wrangler.toml, package-lock.json)
      # actions: read — required by actions/download-artifact to fetch the
      # artifact via the Actions REST API
      # id-token: write — Vault JWT/OIDC auth for Cloudflare credentials
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download worker artifact
        uses: actions/download-artifact@v8
        with:
          name: worker
          path: dist

      # Fetched inside the deploy job so the credentials never leave it — no
      # job outputs, which would persist in the Actions backend.
      - name: Fetch Cloudflare credentials from Vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_URL }}
          method: jwt
          path: jwt
          role: ext-httpbin
          secrets: |
            secret/data/ci-secrets/ext-httpbin cloudflare_api_token | cloudflare_api_token ;
            secret/data/ci-secrets/ext-httpbin cloudflare_account_id | cloudflare_account_id ;

      # Single source of truth for the wrangler version: the lockfile-resolved
      # version — exactly what the build stage just tested. The package.json
      # devDependency is an exact pin (no caret) and matches it.
      - name: Resolve wrangler version
        id: wrangler
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package-lock.json').packages['node_modules/wrangler'].version")"
          # Must be an exact version — a range or empty value would make
          # npx fetch "latest" instead of the tested pin.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Unexpected wrangler version in package-lock.json: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Same deploy command the Bamboo HTTPBIN plan ran. No shared reusable
      # workflow for Workers deploys exists in ext-shared-actions yet
      # (AG-57783); switch to it once one is available.
      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.cloudflare_api_token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.vault.outputs.cloudflare_account_id }}
        run: npx "wrangler@${{ steps.wrangler.outputs.version }}" deploy --route "httpbin.agrd.dev/*"

  notify:
    name: Notify Slack
    needs: [build, deploy]
    # One job for both outcomes so the channel, action version, and format
    # can't drift between success and failure notifications. The failure
    # notification replaces the old Bamboo failure webhook to jirahub.
    if: always()
    runs-on: team-extensions
    timeout-minutes: 5
    # Slack action only curls an internal endpoint; no token scope needed.
    permissions: {}
    steps:
      - name: Send Slack success notification
        if: needs.deploy.result == 'success'
        uses: AdGuardSoftwareLimited/actions/actions/slack@master
        with:
          # vars.SLACK_CHANNEL centralizes the channel; falls back to the literal.
          channel: ${{ vars.SLACK_CHANNEL || '#adguard-extension-vcs' }}
          message: >-
            :white_check_mark: *httpbin* deployed to Cloudflare Workers
            (httpbin.agrd.dev) —
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>
          color: good

      # Covers cancelled as well as failure — a timed-out or manually
      # cancelled job must not leave the deploy silently broken.
      - name: Send Slack failure notification
        if: >-
          needs.build.result == 'failure' ||
          needs.build.result == 'cancelled' ||
          needs.deploy.result == 'failure' ||
          needs.deploy.result == 'cancelled'
        uses: AdGuardSoftwareLimited/actions/actions/slack@master
        with:
          channel: ${{ vars.SLACK_CHANNEL || '#adguard-extension-vcs' }}
          message: >-
            :x: *httpbin* deploy failed —
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>
          color: danger
