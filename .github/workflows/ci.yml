# Lints, tests, and builds the worker via Docker. Runs on every pull request.
# Pushes to master are covered by deploy.yml, which runs the same validation
# before deploying — CI never deploys.
name: CI

on:
  pull_request:

# Cancel superseded CI runs for the same ref. Only validation runs here (no
# deploy), so cancelling an in-progress run mid-way is safe.
concurrency:
  group: ci-ext-httpbin-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default: CI only validates; it never deploys or writes to the repo.
permissions:
  contents: read

jobs:
  test:
    name: Lint, test, build
    runs-on: team-extensions
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Isolate the BuildKit npm cache per PR (untrusted, contributor code) so
      # one PR can't poison the cache another PR or a trusted master build reads.
      # Forks get a per-fork-owner scope so fork builds can never share a cache
      # mount with same-repo PRs or the trusted master scope — even if the PR
      # edits this workflow file (on pull_request the workflow comes from the
      # merge ref). Same-repo PRs are additionally gated by maintainer review.
      - name: Lint, test, and build via Docker
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REPO" == "${{ github.repository }}" ]]; then
            scope="pr-${{ github.event.pull_request.number }}"
          else
            scope="fork-${{ github.event.pull_request.head.repo.owner.login }}-pr-${{ github.event.pull_request.number }}"
          fi
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --target test-output \
            --build-arg "CACHE_SCOPE=$scope" \
            .
