name: Deploy

description: >-
  Lints, tests, builds, and deploys the worker to Cloudflare Workers
  (httpbin.agrd.dev/*) on every push to master. Replicates the old Bamboo
  HTTPBIN plan. Pull requests are validated by ci.yml and never deploy.

on:
  push:
    branches: [master]

# Serialize deploys: two master pushes must not race the wrangler deploy.
concurrency:
  group: deploy-ext-httpbin
  cancel-in-progress: false

jobs:
  build:
    name: Lint, test, build
    runs-on: team-extensions
    timeout-minutes: 30
    permissions:
      # contents: read — checkout only; this job never writes to the repo
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Trusted master build — uses the trusted BuildKit cache scope.
      - name: Lint, test, and build via Docker
        run: |
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --target build-output \
            --build-arg CACHE_SCOPE=trusted \
            --output ./dist \
            .

      - name: Upload worker artifact
        uses: actions/upload-artifact@v7
        with:
          name: worker
          path: dist
          # Only consumed by the deploy job seconds later.
          retention-days: 1

  fetch-cloudflare-secrets:
    name: Fetch Cloudflare secrets from Vault
    needs: build
    runs-on: team-extensions
    timeout-minutes: 5
    permissions:
      # contents: read — no repo writes
      # id-token: write — Vault JWT/OIDC auth for Cloudflare credentials
      contents: read
      id-token: write
    outputs:
      cloudflare_api_token: ${{ steps.vault.outputs.cloudflare_api_token }}
      cloudflare_account_id: ${{ steps.vault.outputs.cloudflare_account_id }}
    steps:
      - name: Fetch Cloudflare credentials from Vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_URL }}
          method: jwt
          path: jwt
          role: ext-httpbin
          secrets: |
            secret/data/ci-secrets/ext-httpbin cloudflare_api_token | cloudflare_api_token ;
            secret/data/ci-secrets/ext-httpbin cloudflare_account_id | cloudflare_account_id ;

  deploy:
    name: Deploy to Cloudflare Workers
    needs: [build, fetch-cloudflare-secrets]
    runs-on: team-extensions
    timeout-minutes: 10
    permissions:
      # contents: read — checkout (wrangler.toml, package.json)
      # actions: read — required by actions/download-artifact to fetch the
      # artifact via the Actions REST API
      contents: read
      actions: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ needs.fetch-cloudflare-secrets.outputs.cloudflare_api_token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ needs.fetch-cloudflare-secrets.outputs.cloudflare_account_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download worker artifact
        uses: actions/download-artifact@v8
        with:
          name: worker
          path: dist

      # Single source of truth for the wrangler pin: the package.json
      # devDependency, so CI and manual deploys always use the same wrangler.
      - name: Resolve wrangler version
        id: wrangler
        run: echo "version=$(node -p "require('./package.json').devDependencies.wrangler")" >> "$GITHUB_OUTPUT"

      # Same deploy command the Bamboo HTTPBIN plan ran. No shared reusable
      # workflow for Workers deploys exists in ext-shared-actions yet
      # (AG-57783); switch to it once one is available.
      - name: Deploy worker
        run: npx "wrangler@${{ steps.wrangler.outputs.version }}" deploy --route "httpbin.agrd.dev/*"

  notify:
    name: Notify success
    needs: [deploy]
    runs-on: team-extensions
    timeout-minutes: 5
    # Slack action only curls an internal endpoint; no token scope needed.
    permissions: {}
    steps:
      - name: Send Slack notification
        uses: AdGuardSoftwareLimited/actions/actions/slack@master
        with:
          # vars.SLACK_CHANNEL centralizes the channel; falls back to the literal.
          channel: ${{ vars.SLACK_CHANNEL || '#adguard-extension-vcs' }}
          message: >-
            :white_check_mark: *httpbin* deployed to Cloudflare Workers
            (httpbin.agrd.dev) —
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>
          color: good

  notify-failure:
    name: Notify failure
    needs: [build, fetch-cloudflare-secrets, deploy]
    # Fires only when a deploy job actually failed (replaces the old Bamboo
    # failure webhook to jirahub).
    if: failure()
    runs-on: team-extensions
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Send Slack failure notification
        uses: AdGuardSoftwareLimited/actions/actions/slack@master
        with:
          channel: ${{ vars.SLACK_CHANNEL || '#adguard-extension-vcs' }}
          message: >-
            :x: *httpbin* deploy failed —
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>
          color: danger
